name: update-data

# Mise à jour automatique : récupère SEC + cours, recalcule, publie le site.
on:
  schedule:
    - cron: "37 21 * * 1-5"   # ~22h37 Paris l'hiver : après la clôture US (résultats publiés après la séance)
    - cron: "07 13 * * 1-5"   # ~14h07 Paris : rattrape les 10-Q/10-K déposés le matin avant l'ouverture US
  workflow_dispatch: {}        # bouton "Run workflow" dans l'onglet Actions
  push:
    branches: [main]
    paths:
      - "config/**"
      - "pipeline/**"
      - "supabase/**"
      - "docs/assets/**"
      - "docs/index.html"
      - ".github/workflows/**"

permissions:
  contents: write   # commit de l'historique (docs/data)
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:   # base jetable pour tester les règles de l'espace membres (RLS, dates limites, ordres)
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # historique Git complet : l'heure des commits horodate les prédictions

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7   # pour le test de parité DCF Python ↔ JS
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Tests
        shell: bash
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          # each failure becomes an annotation (readable on the run page without opening the logs)
          status=0
          python -m pytest -q -rf --tb=line 2>&1 | tee pytest.log || status=$?
          if [[ $status != 0 ]]; then
            tail -5 pytest.log | while IFS= read -r l; do echo "::warning title=pytest::${l//%/%25}"; done
            grep -E "^(FAILED|ERROR) |^/.*:[0-9]+: |^E  " pytest.log | head -15 | while IFS= read -r l; do echo "::error title=Test::${l//%/%25}"; done
          fi
          exit $status

      - name: Base membres (migrations Supabase)
        continue-on-error: true   # un souci de base ne doit pas bloquer la mise à jour des cours
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ARCHER_ADMIN_EMAIL: ${{ secrets.ARCHER_ADMIN_EMAIL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # journal publié avec le site : dbadmin n'écrit jamais les secrets, seulement leur forme
          set -o pipefail
          { python -m pipeline.dbadmin check && python -m pipeline.dbadmin migrate && python -m pipeline.dbadmin founder; } 2>&1 | tee dbadmin.log

      - name: Pipeline (SEC + marché → valorisation → feed)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          python -u -m pipeline.build 2>&1 | tee pipeline.log

      - name: Publier le journal du pipeline (diagnostic)
        if: always()
        run: |
          mkdir -p docs/data
          cp pipeline.log docs/data/_last_run.log 2>/dev/null || echo "pas de journal" > docs/data/_last_run.log
          cp dbadmin.log docs/data/_db_last_run.log 2>/dev/null || echo "pas de journal" > docs/data/_db_last_run.log

      - name: Enregistrer l'historique dans le repo
        if: always()
        run: |
          git config user.name "terminal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Aucun changement de données."
          else
            git commit -m "data: mise à jour $(date -u +'%Y-%m-%d %H:%M') UTC"
            # un autre run (ajout de valeur, relance) a pu pousser entre-temps : en cas de conflit sur
            # docs/data, les données de CE run, les plus récentes, gagnent ; 3 tentatives
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash -X theirs origin main && git push; then ok=1; break; fi
              echo "push refusé (tentative $i), nouvel essai"; git rebase --abort 2>/dev/null || true; sleep $((i * 5))
            done
            if [[ $ok != 1 ]]; then echo "::error::Impossible d'enregistrer les données dans le repo"; exit 1; fi
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
