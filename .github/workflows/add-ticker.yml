name: Ajouter une valeur

# Onglet Actions > « Ajouter une valeur » > Run workflow.
# Crée config/assumptions/<TICKER>.yaml à partir de l'historique SEC, ajoute la valeur et ses pairs
# dans config/universe.yaml, puis relance la mise à jour du site (~3 minutes au total).
# Autre déclencheur, sans passer par l'onglet Actions : commiter demandes/ajouter-valeurs.yaml (mêmes champs que
# ci-dessous : ticker, peers, sector, industry, etf, etf_name) ; le fichier est supprimé une fois la demande traitée.
on:
  push:
    branches: [main]
    paths: ["demandes/ajouter-valeurs.yaml"]
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker US, ou plusieurs séparés par des virgules (ex. LLY,MRK). Classes avec un tiret : BRK-B"
        required: true
      peers:
        description: "Pairs pour les comparables, séparés par des virgules (ex. MRK,SNY,NVO,AZN). Une valeur n'est jamais son propre pair"
        required: false
        default: ""
      sector:
        description: "Secteur affiché (facultatif, sinon code SIC de la SEC)"
        required: false
        default: ""
      industry:
        description: "Activité affichée (facultatif)"
        required: false
        default: ""
      etf:
        description: "ETF sectoriel de comparaison (facultatif, ex. XLP, XLK, XLF, XLV)"
        required: false
        default: ""
      etf_name:
        description: "Nom affiché de l'ETF (facultatif, ex. Consommation de base (ETF XLP))"
        required: false
        default: ""

permissions:
  contents: write   # commit des fichiers de configuration
  actions: write    # relance du workflow update-data

concurrency:
  group: update-data   # jamais en même temps que la mise à jour du site
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lire la demande (demandes/ajouter-valeurs.yaml)
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import yaml
          d = yaml.safe_load(open("demandes/ajouter-valeurs.yaml", encoding="utf-8")) or {}
          for k in ("ticker", "peers", "sector", "industry", "etf", "etf_name"):
              print(f"REQ_{k.upper()}=" + " ".join(str(d.get(k) or "").split()))
          PY

      - name: Créer la couverture
        shell: bash   # -e -o pipefail : une erreur du script fait échouer l'étape (sinon masquée par « tee »)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          IN_TICKER: ${{ inputs.ticker || env.REQ_TICKER }}
          IN_PEERS: ${{ inputs.peers || env.REQ_PEERS }}
          IN_SECTOR: ${{ inputs.sector || env.REQ_SECTOR }}
          IN_INDUSTRY: ${{ inputs.industry || env.REQ_INDUSTRY }}
          IN_ETF: ${{ inputs.etf || env.REQ_ETF }}
          IN_ETF_NAME: ${{ inputs.etf_name || env.REQ_ETF_NAME }}
        run: |
          # entrées passées par variables d'environnement (jamais interpolées dans le script) ; espaces retirés
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; printf '%s' "${v%"${v##*[![:space:]]}"}"; }
          IN_TICKER="$(trim "$IN_TICKER")"; IN_ETF="$(trim "$IN_ETF")"; IN_PEERS="$(trim "$IN_PEERS")"
          if [[ -n "$IN_ETF" ]] && ! [[ "$IN_ETF" =~ ^[A-Za-z]{1,6}$ ]]; then echo "::error::ETF invalide : $IN_ETF"; exit 1; fi
          IFS=',' read -ra TICKERS <<< "$IN_TICKER"
          : > scaffold.log
          for T in "${TICKERS[@]}"; do
            T="$(trim "$T")"; [[ -z "$T" ]] && continue
            if ! [[ "$T" =~ ^[A-Za-z]{1,6}(-[A-Za-z])?$ ]]; then echo "::error::Ticker invalide : $T"; exit 1; fi
            args=("$T" --peers "$IN_PEERS")
            [[ -n "$IN_SECTOR" ]] && args+=(--sector "$IN_SECTOR")
            [[ -n "$IN_INDUSTRY" ]] && args+=(--industry "$IN_INDUSTRY")
            [[ -n "$IN_ETF" ]] && args+=(--etf "$IN_ETF")
            [[ -n "$IN_ETF_NAME" ]] && args+=(--etf-name "$IN_ETF_NAME")
            echo "== $T" | tee -a scaffold.log
            python -m pipeline.scaffold "${args[@]}" | tee -a scaffold.log
          done
          {
            echo "### Valeur ajoutée"
            echo '```'
            cat scaffold.log
            echo '```'
            echo "Les hypothèses sont un point de départ tiré de l'historique : modifie config/assumptions/<TICKER>.yaml."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer et relancer la mise à jour du site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IN_TICKER: ${{ inputs.ticker || env.REQ_TICKER }}
        run: |
          git config user.name "terminal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch demandes/ajouter-valeurs.yaml
          git add config
          if git diff --cached --quiet; then
            echo "::warning::Rien de nouveau : ${IN_TICKER^^} est peut-être déjà suivie."
          else
            git commit -m "couverture : ajout de ${IN_TICKER^^}"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
              echo "push refusé (tentative $i), nouvel essai"; git rebase --abort 2>/dev/null || true; sleep $((i * 5))
            done
            if [[ $ok != 1 ]]; then echo "::error::Impossible d'enregistrer la nouvelle valeur dans le repo"; exit 1; fi
          fi
          # un push fait avec ce jeton ne relance pas les workflows : relance explicite
          gh workflow run update.yml --ref main
