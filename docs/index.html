  <script>
    /* Decided before first paint: effects off (visitor's choice or "reduce motion"), and whether the once-per-session opening plays. */
    (function () {
      var d = document.documentElement, off = false, calm = false;
      /* one-time move of settings saved under the former name (archer-*): saved DCF models, drafts, language, effects */
      try { var ks = []; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf("archer-") === 0) ks.push(k); }
        ks.forEach(function (k) { var n = "mangrove-" + k.slice(7); if (localStorage.getItem(n) === null) localStorage.setItem(n, localStorage.getItem(k)); localStorage.removeItem(k); }); } catch (e) {}
      try { off = localStorage.getItem("mangrove-fx") === "off"; } catch (e) {}
      try { calm = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
      if (off || calm) d.classList.add("fx-off");
      try { if (!off && !calm && !sessionStorage.getItem("mangrove-booted")) { sessionStorage.setItem("mangrove-booted", "1"); d.classList.add("pre-boot"); } } catch (e) {}
    })();
  </script>
