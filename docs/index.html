<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archer Terminal</title>
  <meta name="description" content="Archer Terminal : analyse fondamentale, valorisation, options et registre de prédictions.">
  <meta name="theme-color" content="#0a0d13">
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Archer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="Archer Terminal">
      <img class="brand-mark" src="assets/brand/archer-mark.png" alt="">
      <img class="brand-word" src="assets/brand/archer-wordmark.png" alt="Archer">
      <span class="brand-sub">Terminal</span>
    </a>
    <div class="search" id="searchBtn" role="button" tabindex="0" aria-label="Rechercher">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="grow">Rechercher une valeur, une page…</span>
      <span class="hint-k"><kbd>Ctrl</kbd> <kbd>K</kbd></span>
    </div>
    <div class="top-right">
      <span id="statusDot"><span class="pulse"></span><span class="when" id="updatedAt">-</span></span>
      <span id="notifBtn"></span>
      <span id="accountBtn"></span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav class="nav">
        <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Tableau de bord</a>
        <a href="#/predictions" data-nav="predictions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Prédictions</a>
        <a href="#/communaute" data-nav="communaute" class="members-only"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>Communauté</a>
        <a href="#/portefeuilles" data-nav="portefeuilles" class="members-only"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>Portefeuilles</a>
        <a href="#/messages" data-nav="messages" class="members-only"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg>Messages</a>
        <a href="#/admin/membres" data-nav="admin" class="admin-only"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Membres (admin)</a>
        <a href="#/feed" data-nav="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.5"/></svg>Feed</a>
        <a href="#/methodo" data-nav="methodo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2zm0 0A2 2 0 0 0 6 22h12"/></svg>Méthodologie</a>
      </nav>
      <div class="side-title"><span>Valeurs suivies</span><span id="wlCount"></span></div>
      <div id="watchlist"></div>
      <div class="side-title"><span>Indices</span></div>
      <div id="benchlist"></div>
    </aside>
    <main id="view"><div class="loading">Chargement…</div></main>
  </div>

  <div class="cmdk-back" id="cmdkBack"></div>
  <div class="cmdk" id="cmdk" role="dialog" aria-label="Recherche">
    <input id="cmdkInput" placeholder="NVDA, valorisation, feed…" autocomplete="off" spellcheck="false">
    <ul id="cmdkList"></ul>
  </div>

  <script src="assets/vendor/echarts.min.js"></script>
  <script src="assets/vendor/lightweight-charts.standalone.production.js"></script>
  <script src="assets/vendor/supabase-2.117.3.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/dcf.js"></script>
  <script src="assets/core.js"></script>
  <script src="assets/views-home.js"></script>
  <script src="assets/views-ticker.js"></script>
  <script src="assets/views-predict.js"></script>
  <script src="assets/members.js"></script>
  <script src="assets/badges.js"></script>
  <script src="assets/social.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
