<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal — suivi & valorisation d'actions</title>
  <meta name="description" content="Terminal personnel d'analyse fondamentale : états financiers SEC, ratios, DCF, comparables, feed de mises à jour.">
  <meta name="theme-color" content="#0a0d13">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232962ff'/%3E%3Cstop offset='1' stop-color='%2326a69a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M7 21l6-7 5 4 7-9' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="logo">T</span>
      <span>Terminal <small>equity research</small></span>
    </a>
    <div class="search" id="searchBtn" role="button" tabindex="0" aria-label="Rechercher">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="grow">Rechercher une valeur, une page…</span>
      <span class="hint-k"><kbd>Ctrl</kbd> <kbd>K</kbd></span>
    </div>
    <div class="top-right">
      <span id="statusDot"><span class="pulse"></span><span class="when" id="updatedAt">—</span></span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav class="nav">
        <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Tableau de bord</a>
        <a href="#/feed" data-nav="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.5"/></svg>Feed</a>
        <a href="#/methodo" data-nav="methodo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2zm0 0A2 2 0 0 0 6 22h12"/></svg>Méthodologie</a>
      </nav>
      <div class="side-title"><span>Valeurs suivies</span><span id="wlCount"></span></div>
      <div id="watchlist"></div>
      <div class="side-title"><span>Indices</span></div>
      <div id="benchlist"></div>
    </aside>
    <main id="view"><div class="loading">Chargement…</div></main>
  </div>

  <div class="cmdk-back" id="cmdkBack"></div>
  <div class="cmdk" id="cmdk" role="dialog" aria-label="Recherche">
    <input id="cmdkInput" placeholder="NVDA, valorisation, feed…" autocomplete="off" spellcheck="false">
    <ul id="cmdkList"></ul>
  </div>

  <script src="assets/vendor/echarts.min.js"></script>
  <script src="assets/vendor/lightweight-charts.standalone.production.js"></script>
  <script src="assets/dcf.js"></script>
  <script src="assets/core.js"></script>
  <script src="assets/views-home.js"></script>
  <script src="assets/views-ticker.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
