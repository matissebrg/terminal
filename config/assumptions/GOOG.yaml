# ============================================================================
# Hypothèses de valorisation - Alphabet Inc. (GOOG)
# ----------------------------------------------------------------------------
# Fichier créé automatiquement le 2026-10-29 par `python -m pipeline.scaffold` à partir
# de l'HISTORIQUE seul (SEC) : il décrit le passé, ce n'est pas une prévision.
# À toi d'écrire la vue : thèse, croissance, marges, scénarios, guidance.
#   - croissance annuelle moyenne du CA FY2022 → FY2025 : 12,5 %
#   - marge opérationnelle TTM Q2 FY2026 : 33,1 %
#   - taux effectif TTM Q2 FY2026 : 18,4 %
#   - BFR d'exploitation FY2025 : -5,4 % du CA
#
# Modifier depuis GitHub : ouvre ce fichier sur github.com, clique sur le crayon,
# commit -> le site se met à jour tout seul en ~2 minutes. Le simulateur de l'onglet
# Valorisation permet d'essayer des chiffres puis de copier le YAML correspondant.
# "auto" = valeur calculée à partir des données (TTM) ou du marché.
# ============================================================================

ticker: GOOG
updated: 2026-10-29
thesis: >
  À écrire : pourquoi cette valeur, ce que le marché price, ce qui ferait changer d'avis.

dcf:
  years: 10
  base_revenue: ttm
  # Années 1 à 5 (point de départ mécanique : croissance passée qui converge vers 3,0 %).
  revenue_growth: [0.125, 0.106, 0.087, 0.068, 0.049]
  ebit_margin_start: auto
  ebit_margin_target: 0.331          # marge actuelle maintenue (aucune amélioration supposée)
  margin_years_to_target: 5
  tax_rate: 0.184
  d_and_a_pct_revenue: auto
  capex_pct_revenue: auto
  nwc_pct_incremental_revenue: -0.054
  terminal_growth: 0.03
  # Ajouté le 29/10 : ROIC TTM ≈ 32 % (NOPAT / capitaux investis hors trésorerie et participations).
  # Sans lui, le capex actuel (~30 % du CA, investissements IA) serait supposé durer pour toujours.
  terminal_roic: 0.32
  mid_year: true
  include_equity_investments: true

wacc:
  method: capm
  fixed: 0.09
  risk_free: auto
  risk_free_fallback: 0.044
  beta: auto
  beta_fallback: 1.0
  equity_risk_premium: 0.045
  pre_tax_cost_of_debt: 0.05
  debt_weight: auto

scenarios:
  base:
    probability: 0.50
    narrative: Prolongement mécanique de l'historique (à remplacer par ta vue).
  bull:
    probability: 0.25
    narrative: Croissance supérieure de 3 points et marge cible +15 % (à préciser).
    overrides:
      dcf:
        revenue_growth: [0.155, 0.136, 0.117, 0.098, 0.079]
        ebit_margin_target: 0.381
  bear:
    probability: 0.25
    narrative: Croissance inférieure de 3 points et marge cible -15 % (à préciser).
    overrides:
      dcf:
        revenue_growth: [0.095, 0.076, 0.057, 0.038, 0.019]
        ebit_margin_target: 0.281

comps:
  peers: [MSFT, META, PLTR, ORCL]

predictions:
  # Modèle naïf à battre : sequential (dernier trimestre × dernière croissance séquentielle) ou
  # seasonal (même trimestre de l'an dernier × croissance sur un an, pour les activités saisonnières).
  # Choisi automatiquement : le plus précis sur l'historique (erreur moyenne du modèle naïf sur 8 trimestres : séquentiel 8,4 %, saisonnier 1,8 %).
  naive: seasonal

# Guidance publiée par la société, par période (Md$, %), pour comparer tes prédictions.
# Exemple :
#   Q3 FY2027: {revenue: 100.0, revenue_low: 98.0, revenue_high: 102.0, gross_margin: 40.0, source: communiqué du ...}
guidance: {}
