# ============================================================================
# Hypothèses de valorisation - BridgeBio Pharma, Inc. (BBIO)
# ----------------------------------------------------------------------------
# Fichier créé automatiquement le 2026-10-29 par `python -m pipeline.scaffold` à partir
# de l'HISTORIQUE seul (SEC) : il décrit le passé, ce n'est pas une prévision.
# À toi d'écrire la vue : thèse, croissance, marges, scénarios, guidance.
#   - croissance annuelle moyenne du CA FY2022 → FY2025 : 86,3 %
#   - marge opérationnelle TTM Q2 FY2026 : -69,8 %
#   - taux effectif inconnu : 21 % (taux fédéral US) par défaut
#   - BFR d'exploitation FY2025 : -15,5 % du CA
#   - ROIC non calculable : pas de réinvestissement terminal explicite
#
# Modifier depuis GitHub : ouvre ce fichier sur github.com, clique sur le crayon,
# commit -> le site se met à jour tout seul en ~2 minutes. Le simulateur de l'onglet
# Valorisation permet d'essayer des chiffres puis de copier le YAML correspondant.
# "auto" = valeur calculée à partir des données (TTM) ou du marché.
# ============================================================================

ticker: BBIO
updated: 2026-10-29
thesis: >
  À écrire : pourquoi cette valeur, ce que le marché price, ce qui ferait changer d'avis.
  (Valeur suivie par rNPV : le DCF ci-dessous, construit sur des marges encore négatives, n'est gardé
  que pour référence.)

dcf:
  years: 10
  base_revenue: ttm
  # Années 1 à 5 (point de départ mécanique : croissance passée qui converge vers 3,0 %).
  revenue_growth: [0.4, 0.326, 0.252, 0.178, 0.104]
  ebit_margin_start: auto
  ebit_margin_target: -0.698          # marge actuelle maintenue (aucune amélioration supposée)
  margin_years_to_target: 5
  tax_rate: 0.21
  d_and_a_pct_revenue: auto
  capex_pct_revenue: auto
  nwc_pct_incremental_revenue: -0.15
  terminal_growth: 0.03
  # Réinvestissement terminal = croissance terminale / ROIC : le capex actuel n'est pas supposé durer
  # indéfiniment. null = capex et amortissements des années explicites prolongés tels quels.
  terminal_roic: null
  mid_year: true
  include_equity_investments: true

wacc:
  method: capm
  fixed: 0.09
  risk_free: auto
  risk_free_fallback: 0.044
  beta: auto
  beta_fallback: 1.0
  equity_risk_premium: 0.045
  pre_tax_cost_of_debt: 0.05
  debt_weight: auto

scenarios:
  base:
    probability: 0.50
    narrative: Prolongement mécanique de l'historique (à remplacer par ta vue).
  bull:
    probability: 0.25
    narrative: Croissance supérieure de 3 points et marge cible +15 % (à préciser).
    overrides:
      dcf:
        revenue_growth: [0.43, 0.356, 0.282, 0.208, 0.134]
        ebit_margin_target: -0.593
  bear:
    probability: 0.25
    narrative: Croissance inférieure de 3 points et marge cible -15 % (à préciser).
    overrides:
      dcf:
        revenue_growth: [0.37, 0.296, 0.222, 0.148, 0.074]
        ebit_margin_target: -0.803

comps:
  peers: []

predictions:
  # Modèle naïf à battre : sequential (dernier trimestre × dernière croissance séquentielle) ou
  # seasonal (même trimestre de l'an dernier × croissance sur un an, pour les activités saisonnières).
  # Choisi automatiquement : le plus précis sur l'historique (erreur moyenne du modèle naïf sur 8 trimestres : séquentiel 281,4 %, saisonnier 295,9 %).
  naive: sequential

# Guidance publiée par la société, par période (Md$, %), pour comparer tes prédictions.
# Exemple :
#   Q3 FY2027: {revenue: 100.0, revenue_low: 98.0, revenue_high: 102.0, gross_margin: 40.0, source: communiqué du ...}
guidance: {}

# ============================================================================
# rNPV - valeur du portefeuille de médicaments, pondérée par la probabilité de succès
# ----------------------------------------------------------------------------
# HYPOTHÈSES DE DÉPART posées le 31/10/2026 pour faire tourner le modèle : les pics de ventes, dates
# de perte d'exclusivité et marges ci-dessous sont des ordres de grandeur, PAS un consensus. À
# remplacer par ta recherche (taille de population, prix, pénétration, brevets, guidance).
# Faits (communiqué T3 2026 du 29/10/2026) : Attruby US 253,2 M$ au T3 ; redevances Bayer 20,5 M$ ;
# BBP-418 PDUFA 27/11/2026 ; infigratinib (achondroplasie) PDUFA 04/02/2027 ; encaleret (ADH1)
# PDUFA 08/05/2027 ; encaleret (hypoparathyroïdie chronique) phase 3 RECLAIM-HP, résultats début 2028.
# Le simulateur de l'onglet Biotech permet d'essayer d'autres chiffres puis de copier le YAML.
#
# stage : phase1 | phase2 | phase3 | filed | marketed
# area  : taux de succès historiques (BIO 2011-2020) : rare, oncology, cardiovascular, endocrine,
#         neurology, metabolic, hematology, autoimmune... ; pos: auto = produit des taux restants
# Montants en $ ; peak_sales = ventes au pic (part économique : share, ou royalty_rate si licencié)
# ============================================================================
rnpv:
  primary: true            # la valeur affichée (en-tête, tableau de bord, portefeuilles) est la rNPV
  discount_rate: 0.10      # le risque d'échec est dans les probabilités, pas dans le taux
  tax_rate: 0.21
  horizon: 2045
  net_cash: auto           # trésorerie + placements - dette (convertibles comptées à leur nominal)
  corporate:
    annual_cost: 250000000 # frais centraux non affectés aux programmes, par an
    years: 10
  assets:
    - name: Attruby (acoramidis), États-Unis
      indication: Cardiomyopathie amyloïde à transthyrétine (ATTR-CM)
      stage: marketed
      area: cardiovascular
      launch_year: 2025
      peak_sales: 2500000000
      years_to_peak: 6
      loe_year: 2038          # à vérifier (brevets)
      cogs_pct: 0.08
      opex_pct: 0.30
    - name: BEYONTTRA (redevances Bayer, Europe)
      indication: ATTR-CM
      stage: marketed
      area: cardiovascular
      launch_year: 2025
      peak_sales: 800000000   # ventes de Bayer ; BridgeBio touche une redevance
      royalty_rate: 0.30      # paliers « low-thirties » (contrat Bayer 2024), à vérifier
      years_to_peak: 6
      loe_year: 2038
    - name: BBP-418
      indication: Dystrophie des ceintures LGMD2I/R9
      stage: filed
      area: rare
      launch_year: 2027
      peak_sales: 700000000
      years_to_peak: 6
      loe_year: 2041
      cogs_pct: 0.10
      opex_pct: 0.30
    - name: Infigratinib (achondroplasie)
      indication: Achondroplasie
      stage: filed
      area: rare
      launch_year: 2027
      peak_sales: 1500000000
      years_to_peak: 6
      loe_year: 2040
      cogs_pct: 0.08
      opex_pct: 0.30
    - name: Encaleret (ADH1)
      indication: Hypocalcémie autosomique dominante de type 1
      stage: filed
      area: rare
      launch_year: 2027
      peak_sales: 400000000
      years_to_peak: 5
