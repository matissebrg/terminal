# ============================================================================
# Hypothèses de valorisation - ExxonMobil Holdings Corp (XOM)
# ----------------------------------------------------------------------------
# Fichier créé automatiquement le 2026-10-29 par `python -m pipeline.scaffold` à partir
# de l'HISTORIQUE seul (SEC) : il décrit le passé, ce n'est pas une prévision.
# À toi d'écrire la vue : thèse, croissance, marges, scénarios, guidance.
#   - croissance annuelle moyenne du CA FY2022 → FY2025 : -7,0 %
#   - marge opérationnelle TTM Q2 FY2026 : 12,5 %
#   - taux effectif TTM Q2 FY2026 : 25,6 %
#   - BFR d'exploitation FY2025 : 2,9 % du CA
#   - ROIC TTM Q2 FY2026 : 11,5 % (NOPAT / capitaux investis)
#
# Modifier depuis GitHub : ouvre ce fichier sur github.com, clique sur le crayon,
# commit -> le site se met à jour tout seul en ~2 minutes. Le simulateur de l'onglet
# Valorisation permet d'essayer des chiffres puis de copier le YAML correspondant.
# "auto" = valeur calculée à partir des données (TTM) ou du marché.
# ============================================================================

ticker: XOM
updated: 2026-10-29
thesis: >
  À écrire : pourquoi cette valeur, ce que le marché price, ce qui ferait changer d'avis.

dcf:
  years: 10
  base_revenue: ttm
  # Années 1 à 5. Le point de départ mécanique (-7 %/an, CAGR FY2022 → FY2025) partait du pic du
  # prix du pétrole de 2022 : c'est un artefact du cycle, pas une tendance. Remplacé par un CA stable
  # qui rejoint lentement la croissance terminale (point de départ neutre, à remplacer par ta vue).
  revenue_growth: [0.0, 0.005, 0.01, 0.015, 0.02]
  ebit_margin_start: auto
  ebit_margin_target: 0.125          # marge actuelle maintenue (aucune amélioration supposée)
  margin_years_to_target: 5
  tax_rate: 0.256
  d_and_a_pct_revenue: auto
  capex_pct_revenue: auto
  nwc_pct_incremental_revenue: 0.029
  terminal_growth: 0.02             # major pétrolière : croissance de long terme sous l'inflation
  # Réinvestissement terminal = croissance terminale / ROIC : le capex actuel n'est pas supposé durer
  # indéfiniment. null = capex et amortissements des années explicites prolongés tels quels.
  terminal_roic: 0.115
  mid_year: true
  include_equity_investments: true

wacc:
  method: capm
  fixed: 0.09
  risk_free: auto
  risk_free_fallback: 0.044
  beta: auto
  beta_fallback: 0.9                # la régression sur 2 ans ne dit rien (R² ≈ 0) : bêta long terme d'une major
  equity_risk_premium: 0.045
  pre_tax_cost_of_debt: 0.05
  debt_weight: auto

scenarios:
  base:
    probability: 0.50
    narrative: Prolongement mécanique de l'historique (à remplacer par ta vue).
  bull:
    probability: 0.25
    narrative: Croissance supérieure de 3 points et marge cible +15 % (à préciser).
    overrides:
      dcf:
        revenue_growth: [0.03, 0.035, 0.04, 0.045, 0.05]
        ebit_margin_target: 0.144
  bear:
    probability: 0.25
    narrative: Croissance inférieure de 3 points et marge cible -15 % (à préciser).
    overrides:
      dcf:
        revenue_growth: [-0.03, -0.025, -0.02, -0.015, -0.01]
        ebit_margin_target: 0.106

comps:
  peers: [CVX, COP, EOG, OXY]

predictions:
  # Modèle naïf à battre : sequential (dernier trimestre × dernière croissance séquentielle) ou
  # seasonal (même trimestre de l'an dernier × croissance sur un an, pour les activités saisonnières).
  # Choisi automatiquement : le plus précis sur l'historique (erreur moyenne du modèle naïf sur 8 trimestres : séquentiel 9,3 %, saisonnier 9,0 %).
  naive: seasonal

# Guidance publiée par la société, par période (Md$, %), pour comparer tes prédictions.
# Exemple :
#   Q3 FY2027: {revenue: 100.0, revenue_low: 98.0, revenue_high: 102.0, gross_margin: 40.0, source: communiqué du ...}
guidance: {}
