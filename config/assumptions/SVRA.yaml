    date: 2026-11-22
    kind: pdufa
    asset: Molgramostim (PAP auto-immune)
    title: Décision de la FDA sur le molgramostim inhalé (PAP auto-immune)
    confirmed: true
    source: https://www.businesswire.com/news/home/20260415775650/en

trials:
