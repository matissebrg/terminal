# trois mois après un « amendement majeur », sans problème de sécurité, d'efficacité ou de fabrication
# cité par la FDA ; décision attendue le 22/11/2026. Essai pivot IMPALA-2 positif sur son critère principal.
rnpv:
  primary: true
  discount_rate: 0.10
  tax_rate: 0.21
  horizon: 2045
  net_cash: auto
  corporate:
    annual_cost: 50000000
    years: 10
  assets:
    - name: Molgramostim (PAP auto-immune)
      indication: Protéinose alvéolaire pulmonaire auto-immune
      stage: filed
      area: rare
      launch_year: 2027
      peak_sales: 500000000
      years_to_peak: 6
      loe_year: 2039
      cogs_pct: 0.12
      opex_pct: 0.35

catalysts:
