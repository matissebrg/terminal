# ============================================================================
# Hypothèses de valorisation - Praxis Precision Medicines, Inc. (PRAX)
# ----------------------------------------------------------------------------
# Fichier créé automatiquement le 2026-10-31 par `python -m pipeline.scaffold` à partir
# de l'HISTORIQUE seul (SEC) : il décrit le passé, ce n'est pas une prévision.
# À toi d'écrire la vue : thèse, croissance, marges, scénarios, guidance.
#   - croissance du CA FY2023 → FY2024 : 249,5 % (historique court)
#   - marge inconnue : 10 % par défaut
#   - taux effectif inconnu : 21 % (taux fédéral US) par défaut
#   - BFR inconnu : 10 % par défaut
#   - ROIC TTM Q2 FY2026 : -51,3 % (NOPAT / capitaux investis)
#
# Modifier depuis GitHub : ouvre ce fichier sur github.com, clique sur le crayon,
# commit -> le site se met à jour tout seul en ~2 minutes. Le simulateur de l'onglet
# Valorisation permet d'essayer des chiffres puis de copier le YAML correspondant.
# "auto" = valeur calculée à partir des données (TTM) ou du marché.
# ============================================================================

ticker: PRAX
updated: 2026-10-31
thesis: >
  À écrire : pourquoi cette valeur, ce que le marché price, ce qui ferait changer d'avis.

dcf:
  years: 10
  base_revenue: ttm
  # Années 1 à 5 (point de départ mécanique : croissance passée qui converge vers 3,0 %).
  revenue_growth: [0.4, 0.326, 0.252, 0.178, 0.104]
  ebit_margin_start: auto
  ebit_margin_target: 0.1          # marge actuelle maintenue (aucune amélioration supposée)
  margin_years_to_target: 5
  tax_rate: 0.21
  d_and_a_pct_revenue: auto
  capex_pct_revenue: auto
  nwc_pct_incremental_revenue: 0.1
  terminal_growth: 0.03
  # Réinvestissement terminal = croissance terminale / ROIC : le capex actuel n'est pas supposé durer
  # indéfiniment. null = capex et amortissements des années explicites prolongés tels quels.
  terminal_roic: 0.06
  mid_year: true
  include_equity_investments: true

wacc:
  method: capm
  fixed: 0.09
  risk_free: auto
  risk_free_fallback: 0.044
  beta: auto
  beta_fallback: 1.0
  equity_risk_premium: 0.045
  pre_tax_cost_of_debt: 0.05
  debt_weight: auto

scenarios:
  base:
    probability: 0.50
    narrative: Prolongement mécanique de l'historique (à remplacer par ta vue).
  bull:
    probability: 0.25
    narrative: Croissance supérieure de 3 points et marge cible +15 % (à préciser).
    overrides:
      dcf:
        revenue_growth: [0.43, 0.356, 0.282, 0.208, 0.134]
        ebit_margin_target: 0.115
  bear:
    probability: 0.25
    narrative: Croissance inférieure de 3 points et marge cible -15 % (à préciser).
    overrides:
      dcf:
        revenue_growth: [0.37, 0.296, 0.222, 0.148, 0.074]
        ebit_margin_target: 0.085

comps:
  peers: [XENE, NBIX]

predictions:
  # Modèle naïf à battre : sequential (dernier trimestre × dernière croissance séquentielle) ou
  # seasonal (même trimestre de l'an dernier × croissance sur un an, pour les activités saisonnières).
  # Choisi automatiquement : le plus précis sur l'historique (erreur moyenne du modèle naïf sur 8 trimestres : séquentiel 49,3 %, saisonnier 62,4 %).
  naive: sequential

# Guidance publiée par la société, par période (Md$, %), pour comparer tes prédictions.
# Exemple :
#   Q3 FY2027: {revenue: 100.0, revenue_low: 98.0, revenue_high: 102.0, gross_margin: 40.0, source: communiqué du ...}
guidance: {}

# ============================================================================
# rNPV - ajouté le 31/10/2026. HYPOTHÈSES DE DÉPART : pics de ventes, dates de perte d'exclusivité,
# marges et probabilités ajustées sont des ordres de grandeur pour faire tourner le modèle, PAS un
# consensus. Les faits (dates de décision, résultats d'essais) sont sourcés dans les catalyseurs.
# Le simulateur de l'onglet Biotech permet d'essayer d'autres chiffres puis de copier le YAML.
# ============================================================================

# Faits : relutrigine (encéphalopathies épileptiques SCN2A / SCN8A) : EMBOLD -53 % de crises motrices vs
# placebo (n = 51), thérapie innovante (breakthrough), décision repoussée au 27/12/2026 (analyses
# complémentaires), pas de comité consultatif. EMERALD (plus de 50 causes génétiques, ~200 patients) :
# résultats au 4e trimestre 2026. Ulixacaltamide (tremblement essentiel) : décision le 29/01/2027.
rnpv:
  primary: true
  discount_rate: 0.10
  tax_rate: 0.21
  horizon: 2045
  net_cash: auto
  corporate:
    annual_cost: 120000000
    years: 10
  assets:
    - name: Relutrigine (SCN2A / SCN8A)
      indication: Encéphalopathies épileptiques SCN2A et SCN8A
      stage: filed
      area: rare
      launch_year: 2027
      peak_sales: 400000000
      years_to_peak: 5
      loe_year: 2041
      cogs_pct: 0.05
      opex_pct: 0.30
    - name: Relutrigine (encéphalopathies épileptiques élargies)
      indication: Encéphalopathies épileptiques développementales, plus de 50 causes (EMERALD)
      stage: phase3
      area: rare
      launch_year: 2028
      peak_sales: 800000000
      years_to_peak: 6
      loe_year: 2041
      dev_cost: 80000000
      cogs_pct: 0.05
      opex_pct: 0.30
    - name: Ulixacaltamide (tremblement essentiel)
      indication: Tremblement essentiel
      stage: filed
      area: neurology
      launch_year: 2027
      peak_sales: 1500000000
      years_to_peak: 7
      loe_year: 2040
      cogs_pct: 0.05
      opex_pct: 0.35

catalysts:
  - id: emerald-topline
    date: 2026-12-15
    kind: readout
    asset: Relutrigine (encéphalopathies épileptiques élargies)
    title: Résultats principaux d'EMERALD (« 4e trimestre 2026 », date approximative)
    confirmed: false
    source: https://www.neurologylive.com/view/fda-extends-relutrigine-review-delays-pdufa-to-december
  - id: relutrigine-pdufa
    date: 2026-12-27
    kind: pdufa
    asset: Relutrigine (SCN2A / SCN8A)
    title: Décision de la FDA sur la relutrigine (SCN2A / SCN8A), examen prolongé
    confirmed: true
    source: https://www.neurologylive.com/view/fda-extends-relutrigine-review-delays-pdufa-to-december
  - id: ulixacaltamide-pdufa
    date: 2027-01-29
    kind: pdufa
    asset: Ulixacaltamide (tremblement essentiel)
