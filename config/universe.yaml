# Univers suivi par le terminal.
#
# Ajouter une valeur : GitHub > Actions > « Ajouter une valeur » > Run workflow (ticker + pairs).
# Le workflow remplit ce fichier, crée config/assumptions/<TICKER>.yaml à partir de l'historique
# SEC, puis relance la mise à jour du site. En local : python -m pipeline.scaffold WMT --peers COST,TGT
#
# Par valeur :
#   peers       pairs pour les comparables (seuls leurs états financiers et leur cours sont récupérés)
#   benchmarks  indices affichés dans l'onglet Performance (le bêta est toujours mesuré contre SPY)
#   next_earnings  date des prochains résultats ; par défaut, estimation Yahoo. Quand la société
#                  l'annonce :  next_earnings: {date: 2026-11-18, confirmed: true}

benchmarks:
  SPY: S&P 500 (ETF SPY)
  SOXX: Semi-conducteurs (ETF iShares SOXX)
  XLP: Consommation de base (ETF XLP)

beta_benchmark: SPY

tickers:
  NVDA:
    name: NVIDIA Corporation
    sector: Semi-conducteurs
    industry: GPU, accélérateurs IA, réseau data center
    peers: [AMD, AVGO, QCOM, INTC, MRVL]
    benchmarks: [SPY, SOXX]
  WMT:
    name: Walmart Inc.
    sector: Distribution
    industry: Hypermarchés, clubs-entrepôts (Sam's Club), e-commerce, publicité
    peers: [COST, TGT, KR, BJ, DG, AMZN]
    benchmarks: [SPY, XLP]

# Noms affichés pour les pairs (les données viennent de la SEC)
peer_names:
  AMD: Advanced Micro Devices
  AVGO: Broadcom
  QCOM: Qualcomm
  INTC: Intel
  MRVL: Marvell Technology
  COST: Costco Wholesale Corp /new
  TGT: Target Corp
  KR: Kroger Co
  BJ: BJ's Wholesale Club Holdings, Inc.
  DG: Dollar General Corp
  AMZN: Amazon Com Inc

# CIK SEC (identifiant fixe), rempli automatiquement à l'ajout d'une valeur.
ciks:
