# Univers suivi par le terminal.
# Ajouter une valeur : une entrée ici + un fichier config/assumptions/<TICKER>.yaml
# (copier NVDA.yaml comme modèle). Les pairs n'ont pas besoin de fichier d'hypothèses :
# seuls leurs états financiers et leur cours sont récupérés, pour les comparables.

benchmarks:
  SPY: S&P 500 (ETF SPY)
  SOXX: Semi-conducteurs (ETF iShares SOXX)

beta_benchmark: SPY

tickers:
  NVDA:
    name: NVIDIA Corporation
    sector: Semi-conducteurs
    industry: GPU, accélérateurs IA, réseau data center
    peers: [AMD, AVGO, QCOM, INTC, MRVL]

# Noms affichés pour les pairs (les données viennent de la SEC)
peer_names:
  AMD: Advanced Micro Devices
  AVGO: Broadcom
  QCOM: Qualcomm
  INTC: Intel
  MRVL: Marvell Technology

# CIK SEC (identifiant fixe). Évite de dépendre du fichier ticker -> CIK de la SEC ;
# pour un nouveau ticker, laisser vide : le pipeline le cherche tout seul.
ciks:
  NVDA: 1045810
  AMD: 2488
  AVGO: 1730168
  QCOM: 804328
  INTC: 50863
  MRVL: 1835632
